name: peripheral
label: Peripheral
version: 2.1.1
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/okyssta/hermes-peripheral
author: kyssta
requires_hermes: ">=0.22.0"
title: Peripheral — a memory of what you've seen
description: >
  Hermes gets a memory of your screen. Peripheral captures the screen itself — on
  request, or on change in the background — and indexes every screenshot already on
  the machine, reading the text locally with OCR into SQLite/FTS5 with the time it
  appeared. Six tools let the agent search that history by the words that were on
  screen, reconstruct a period on one clock with its own actions, open a screen and
  see the image itself, remember the current screen, and forget what the user asks
  it to forget. Ask "what was that Stripe error yesterday?" or "what was I looking
  at around 3?" and Hermes finds the exact screen and quotes it — even after the
  window is closed and the screenshot file is gone. No OCR? It still works as a
  visual memory. Everything stays on the machine: no account, no API key, no
  network calls.
tags: [memory, screen, capture, ocr, screenshots, local, search, timeline, privacy, vision]

provides_tools:
  - screen_recall
  - screen_timeline
  - screen_show
  - screen_index
  - screen_capture
  - screen_forget

provides_hooks:
  - post_tool_call

config_schema:
  enabled:
    type: bool
    default: true
    label: Enabled
    description: Index screenshots and answer screen-memory queries
  capture_enabled:
    type: bool
    default: false
    label: Background capture
    description: >-
      Capture the screen on a timer and keep a frame only when it changed. Off by
      default; the agent can always capture on request with screen_capture
  capture_interval_seconds:
    type: int
    default: 30
    label: Capture interval (seconds)
    description: How often the background capture looks at the screen (5-3600)
  capture_min_gap_seconds:
    type: int
    default: 15
    label: Minimum gap between frames (seconds)
    description: Do not store another frame sooner than this, even if the screen changed
  capture_max_per_hour:
    type: int
    default: 120
    label: Maximum frames per hour
    description: A per-hour ceiling on background frames. It bounds how fast frames
      accumulate, not how long they live — set retention_days for that
  show_images:
    type: bool
    default: true
    label: Show screens to the model
    description: >-
      Attach the stored image to screen_show / screen_capture results when the
      active model can see images. Off means text only
  watch_dirs:
    type: list
    default: []
    label: Folders to index
    description: >-
      Folders scanned for images. Empty means auto-detect (the usual screenshot
      folders for this OS, plus Hermes' own inbound media folder)
  ocr_languages:
    type: str
    default: "eng"
    label: OCR languages
    description: >-
      Tesseract language codes, "+"-joined (eng, deu, fra, spa, ita, por, nld,
      rus, ara, urd, chi_sim, jpn, kor). Missing packs are skipped with a warning
  auto_scan_minutes:
    type: int
    default: 10
    label: Background scan interval (minutes)
    description: >-
      How often to look for new screenshots in the background. 0 disables the
      background scan; queries still index new files first
  include_photos:
    type: bool
    default: false
    label: Index photos too
    description: >-
      Also index images with almost no text (photos, art). Off by default: they
      cost OCR time and add nothing to text search
  max_text_chars:
    type: int
    default: 20000
    label: Max characters kept per image
    description: OCR text beyond this is dropped (200-200000)
  retention_days:
    type: int
    default: 0
    label: Retention (days)
    description: >-
      Drop entries older than this on every scan, deleting their thumbnails and
      captured frames too. 0 keeps everything: no automatic pruning
  redact:
    type: bool
    default: true
    label: Redact secrets
    description: >-
      Strip API keys, bearer tokens, private keys and card numbers from indexed
      text before it is stored
  thumbnails:
    type: bool
    default: true
    label: Keep thumbnails
    description: >-
      Store a 360px thumbnail per image, so a screenshot still resolves after the
      original is deleted
  record_agent_events:
    type: bool
    default: true
    label: Record agent activity
    description: >-
      Record the agent's tool calls next to your screenshots, so the timeline can
      interleave what you saw with what Hermes did
