[pytest]
testpaths = tests
# The plugin root is itself a Python package (`__init__.py` with relative imports, as
# the Hermes plugin layout requires). Rooting collection at `tests/` keeps pytest from
# walking up into that package, which also means the checkout can be named anything —
# `hermes-peripheral`, `verify-922b`, whatever the user cloned it into.
addopts = --import-mode=importlib --rootdir=tests
filterwarnings =
    ignore::DeprecationWarning
